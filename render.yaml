databases:
  - name: poller-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: poller
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production (set below) makes plain `npm ci` skip
    # devDependencies, but next build needs tailwindcss/@tailwindcss/postcss/typescript
    # from there. Those stay devDependencies (the running server doesn't need them) --
    # this just forces them in for the build step specifically.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poller-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
