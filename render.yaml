databases:
  - name: poller-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: poller
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poller-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
